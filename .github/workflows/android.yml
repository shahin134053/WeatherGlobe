name: Build & Release (WeatherGuru Gold)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build WeatherGuru Gold (APK, AAB & iOS)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Install Capacitor & Platforms
        run: |
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest

      - name: Setup Android & iOS Native Projects
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          fi
          if [ ! -d "ios" ]; then
            echo "Adding iOS platform..."
            npx cap add ios || true
          fi
          npx cap sync
          echo "Configuring WeatherGuru Gold launcher icons..."
          node scripts/setup-android-icons.cjs

      - name: Grant Execute Permission for Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK (Installable on any Android phone)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Release AAB (Google Play Store Bundle)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Prepare Release Packages
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/WeatherGuru-Gold-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-assets/WeatherGuru-Gold-PlayStore.aab
          zip -r release-assets/WeatherGuru-Gold-iOS.zip ios dist capacitor.config.json

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGuru-Gold-Packages
          path: release-assets/*
          retention-days: 30

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: WeatherGuru-Gold
          name: "WeatherGuru Gold (ওয়েদার গুরু গোল্ড)"
          draft: false
          prerelease: false
          body: |
            # 🌟 WeatherGuru Gold (ওয়েদার গুরু গোল্ড) — Official Release

            ওয়েদার গুরু গোল্ড (WeatherGuru Gold) মোবাইল ও ওয়েব অ্যাপের অফিশিয়াল রিলিজ।

            ### 📲 সরাসরি ডাউনলোড লিংক (Direct Downloads):
            1. **`WeatherGuru-Gold-Android.apk`**
               - সরাসরি যেকোনো অ্যান্ড্রয়েড ডিভাইসে ইনস্টল করার জন্য প্রস্তুত APK ফাইল।
               - Uptodown, APKPure বা যেকোনো স্টোরে পাবলিশের উপযোগী।

            2. **`WeatherGuru-Gold-PlayStore.aab`**
               - Google Play Store-এর অফিসিয়াল Android App Bundle (AAB)।
               - সম্পূর্ণ 64-বিট ও লেটেস্ট Target SDK সমর্থিত।

            3. **`WeatherGuru-Gold-iOS.zip`**
               - Apple iPhone-এর জন্য সম্পূর্ণ Capacitor iOS প্রজেক্ট ফাইল।
               - Xcode ও TestFlight-এর জন্য প্রস্তুত।

            ---
            *Built automatically via GitHub Actions CI/CD.*
          files: |
            release-assets/WeatherGuru-Gold-Android.apk
            release-assets/WeatherGuru-Gold-PlayStore.aab
            release-assets/WeatherGuru-Gold-iOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
