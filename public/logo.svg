<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" />
  
  <!-- Glowing Sun -->
  <circle cx="180" cy="180" r="75" fill="url(#sunGrad)" filter="url(#glow)" />
  
  <!-- Orbiting Globe Ring -->
  <ellipse cx="256" cy="270" rx="190" ry="85" fill="none" stroke="#ffffff" stroke-width="12" stroke-dasharray="32 16" opacity="0.45" transform="rotate(-18 256 270)" />
  
  <!-- 3D Cloud Structure -->
  <path d="M 190 350 
           L 350 350 
           A 55 55 0 0 0 350 240 
           A 75 75 0 0 0 220 205 
           A 65 65 0 0 0 145 285 
           A 55 55 0 0 0 190 350 Z" 
        fill="url(#cloudGrad)" 
        filter="url(#glow)" />
        
  <!-- Rain Drops -->
  <line x1="210" y1="375" x2="195" y2="415" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  <line x1="270" y1="375" x2="255" y2="415" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
  <line x1="330" y1="375" x2="315" y2="415" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />
</svg>
